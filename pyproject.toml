[project]
name = "apophenia"
version = "2.0.0"
description = "Self-evolving audio-reactive AV instrument driven by GLSL shaders"
authors = [{ name = "Hal Xu" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"

# Phase 13 strip: dropped the V1 control plane (fastapi / uvicorn /
# python-osc / web UI) when the autopilot replaced human control.
# Base deps are now: audio capture, schema, CLI plumbing.
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "pydantic>=2.5",
    "typer>=0.9",
    "rich>=13.7",
]

[project.optional-dependencies]
visuals = [
    "moderngl>=5.10",
    "moderngl-window>=2.4",
    "glfw>=2.6",  # explicit window backend; reliable on macOS / X11 / Wayland
]
clap = [
    # CLAP audio embedding (slow tier).
    "torch>=2.2",
    "transformers>=4.40",
    "safetensors>=0.4",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
    "mypy>=1.9",
]

[project.scripts]
apophenia = "apophenia.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["apophenia"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "sounddevice",
    "soundfile",
    "moderngl",
    "moderngl_window",
]
ignore_missing_imports = true
