[project]
name = "synapse"
version = "3.0.0"
description = "Multichannel audio analyser → MaxMSP bridge (CV / gate / spectrum over OSC)"
authors = [{ name = "Hal Xu" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"

# synapse: audio capture + feature pipeline (RMS / centroid / onset
# / CV / gate / spectrum) + OSC output to MaxMSP + a small FastAPI
# server hosting the web meter for live debugging. Replaced the
# pre-pivot AV instrument; old code is preserved at the
# `archive/apophenia-visual-instrument` git tag.
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "typer>=0.9",
    "rich>=13.7",
    # OSC output to MaxMSP / any OSC consumer.
    "python-osc>=1.8",
    # Web meter UI (FastAPI + WebSocket broadcast).
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
clap = [
    # CLAP audio embedding (slow tier). Optional; useful as an extra
    # OSC stream if you want a high-level mood / genre vector
    # alongside CV / gate / spectrum.
    "torch>=2.2",
    "transformers>=4.40",
    "safetensors>=0.4",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
    "mypy>=1.9",
    "httpx>=0.27",  # required by fastapi.testclient
]

[project.scripts]
synapse = "synapse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["synapse"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "sounddevice",
    "soundfile",
]
ignore_missing_imports = true
