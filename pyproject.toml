[project]
name = "apophenia"
version = "1.1.0"
description = "Multi-channel audio-reactive AV instrument driven by GLSL shaders"
authors = [{ name = "Hal Xu" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"

# Base deps cover audio capture, fast features, control UI, presets.
# Visual + CLAP deps are extras so a remote / dev install doesn't have
# to download torch up front.
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "python-osc>=1.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "typer>=0.9",
    "rich>=13.7",
]

[project.optional-dependencies]
visuals = [
    "moderngl>=5.10",
    "moderngl-window>=2.4",
    "glfw>=2.6",  # explicit window backend; reliable on macOS / X11 / Wayland
]
clap = [
    # CLAP audio embedding (slow tier). Phase 10 dropped the SDXL image
    # generator; torch + transformers are kept for CLAP only.
    "torch>=2.2",
    "transformers>=4.40",
    "safetensors>=0.4",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
    "mypy>=1.9",
    "httpx>=0.27",  # required by fastapi.testclient
]

[project.scripts]
apophenia = "apophenia.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["apophenia"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "sounddevice",
    "soundfile",
    "moderngl",
    "moderngl_window",
]
ignore_missing_imports = true
